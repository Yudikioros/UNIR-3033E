services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ./data/ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - ./data/qdrant_storage:/qdrant/storage

  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      - LLM_API_URL=http://ollama:11434/v1
      - QDRANT_URL=http://qdrant:6333
      - LLM_MODEL=${LLM_MODEL}
    depends_on:
      - ollama
      - qdrant
    volumes:
      - ./backend/src:/app/src
      - ./data/pdfs:/app/data/pdfs
      - ./data/tables:/app/data/tables
      - ./data/db:/app/data/db

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api/v1
    depends_on:
      - backend
