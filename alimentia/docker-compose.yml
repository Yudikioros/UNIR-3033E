services:
  vllm:
    image: vllm/vllm-openai:latest
    ports:
      - "8000:8000"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: --model Qwen/Qwen2.5-7B-Instruct --dtype auto --max-model-len 4096

  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      - VLLM_API_URL=http://vllm:8000/v1
    depends_on:
      - vllm

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8080
    depends_on:
      - backend